name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project Todo.xcodeproj \
            -scheme Todo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(Swift|swift)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Todo.app

      - name: Package IPA (embed entitlements so the sideloader keeps the app group)
        run: |
          APP=build/Build/Products/Release-iphoneos/Todo.app
          ldid -SWidget/TodoWidget.entitlements "$APP/PlugIns/TodoWidget.appex/TodoWidget"
          ldid -SApp/Todo.entitlements "$APP/Todo"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Todo.ipa Payload
          ls -lh Todo.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish to Releases
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: Todo build ${{ github.run_number }}
          body: "Download Todo.ipa and install it with SideStore or Sideloadly."
          artifacts: Todo.ipa
          makeLatest: true
