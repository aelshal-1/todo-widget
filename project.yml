name: Todo
options:
  bundleIdPrefix: com.aelshal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Todo:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Todo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.aelshal.todo
            CFBundleURLSchemes: [atodo]
        NSMicrophoneUsageDescription: Used to add tasks by voice.
        NSSpeechRecognitionUsageDescription: Turns what you say into a task.
        NSCalendarsWriteOnlyAccessUsageDescription: Adds appointments to your calendar.
        NSCalendarsFullAccessUsageDescription: Adds appointments to your calendar.
    entitlements:
      path: App/Todo.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aelshal.todo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aelshal.todo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TodoWidget
    scheme: {}
  TodoWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Todo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/TodoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aelshal.todo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aelshal.todo.widget
